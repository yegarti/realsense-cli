name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: Install just
        uses: extractions/setup-just@v4
      - name: Install dependencies
        run: uv sync --locked
      - name: Run checks
        run: just check
