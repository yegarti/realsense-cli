[project]
name = "realsense-cli"
version = "0.3.1"
description = "Command-line interface for Intel RealSense cameras"
authors = [{ name = "Yehuda Garti", email = "yeudag@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "typer>=0.12.0",
    "pyrealsense2>=2.54.1",
    "loguru>=0.7.0",
    "rosbags>=0.9.19",
]

[project.scripts]
rs = "realsense_cli.cli:app"

[dependency-groups]
dev = [
    "ty",
    "pytest>=7.4.1",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.sdist]
include = ["realsense_cli"]

[tool.hatch.build.targets.wheel]
include = ["realsense_cli"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-s -ra -m 'not hardware'"
markers = ["hardware: requires a physical RealSense device to be connected"]

[tool.ty.src]
exclude = ["realsense_cli/driver/realsense.py"]

