[project]
name = "realsense-cli"
version = "0.3.1"
description = "Command-line interface for Intel RealSense cameras"
authors = [{ name = "Yehuda Garti", email = "yeudag@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "typer>=0.27.3",
    "pyrealsense2>=2.56.5",
    "loguru>=0.7.3",
    "rosbags>=0.11.8",
]

[project.scripts]
rs = "realsense_cli.cli:app"

[dependency-groups]
dev = [
    "ty>=0.0.89",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.hatch.build.targets.sdist]
include = ["realsense_cli"]

[tool.hatch.build.targets.wheel]
include = ["realsense_cli"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]

[tool.ruff.lint.per-file-ignores]
# Output goes through realsense_cli.console; tests may print
"tests/**" = ["T20"]

[tool.pytest.ini_options]
addopts = "-s -ra -m 'not hardware'"
markers = ["hardware: requires a physical RealSense device to be connected"]



[tool.ty.environment]
# Partial pyrealsense2 stub; the package ships no type information
extra-paths = ["typings"]
